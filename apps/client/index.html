<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crystal Gamers</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l8 10-8 18-8-18z' fill='%23ff2e88'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #3a7bff;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #fff;
        font-size: 15px;
        line-height: 1.5;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #hud b {
        font-size: 22px;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .nick {
        position: absolute;
        left: 0;
        top: 0;
        padding: 1px 6px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="labels"></div>
    <div id="hud">
      <b>Crystal Gamers</b><br />
      <span id="status">…</span><br />
      <span id="crystals"></span><br />
      <span id="hint"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
