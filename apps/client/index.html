<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crystal Gamers</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l8 10-8 18-8-18z' fill='%23ff2e88'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #3a7bff;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #fff;
        font-size: 15px;
        line-height: 1.5;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #hud b {
        font-size: 22px;
      }
      #invite {
        margin-top: 6px;
        pointer-events: auto;
        font: inherit;
        padding: 4px 10px;
        border: 0;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        cursor: pointer;
      }
      #lobby {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 30, 60, 0.55);
        /* above the ?debug panel */
        z-index: 2000;
      }
      #lobby .card {
        width: min(340px, 90vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 22px;
        border-radius: 14px;
        background: #1d2333;
        color: #fff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      #lobby [hidden] {
        display: none;
      }
      #lobby .card.wide {
        width: min(760px, 94vw);
      }
      #lobby h2 {
        margin: 0;
        font-size: 20px;
        text-align: center;
      }
      #lobby .heroes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      #lobby button.hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 12px 8px;
        background: #111622;
        color: #fff;
        border: 2px solid #3a4560;
        border-top: 6px solid var(--hero);
        font-weight: 400;
      }
      #lobby button.hero.chosen {
        border-color: var(--hero);
        box-shadow: 0 0 0 2px var(--hero);
      }
      #lobby button.hero.taken {
        filter: grayscale(1);
        opacity: 0.45;
      }
      #lobby .hero strong {
        font-size: 17px;
      }
      #lobby .hero small {
        font-size: 12px;
      }
      #lobby .silhouette {
        width: 60px;
        height: 100px;
      }
      #lobby .hero dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 8px;
        margin: 0;
        font-size: 12px;
        text-align: left;
      }
      #lobby .hero dt {
        opacity: 0.75;
      }
      #lobby .hero dd {
        margin: 0;
        color: var(--hero);
        letter-spacing: 1px;
        filter: brightness(1.4);
      }
      #lobby h1 {
        margin: 0 0 6px;
        font-size: 24px;
        text-align: center;
      }
      #lobby label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        opacity: 0.85;
      }
      #lobby input,
      #lobby button {
        font: inherit;
        font-size: 16px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid #3a4560;
      }
      #lobby input {
        background: #111622;
        color: #fff;
      }
      #lobby .code {
        width: 5.5em;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      #lobby button {
        background: #2fd5c8;
        color: #10202a;
        border: 0;
        font-weight: 600;
        cursor: pointer;
      }
      #lobby button.quiet {
        background: transparent;
        color: #cfd6e6;
        border: 1px solid #3a4560;
        font-weight: 400;
      }
      #lobby button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #lobby .row {
        display: flex;
        gap: 8px;
      }
      #lobby .row button {
        flex: 1;
      }
      #lobby .or {
        margin: 2px 0 -4px;
        font-size: 13px;
        opacity: 0.7;
        text-align: center;
      }
      #lobby .message {
        min-height: 1.3em;
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
      }
      #lobby .message.error {
        color: #ff8f8f;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .nick {
        position: absolute;
        left: 0;
        top: 0;
        padding: 1px 6px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="labels"></div>
    <div id="hud">
      <b>Crystal Gamers</b><br />
      <span id="status">…</span><br />
      <span id="crystals"></span><br />
      <span id="hint"></span><br />
      <button id="invite" type="button" hidden></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
